name: Check RSS Feeds

on:
  schedule:
    # 每周一早上 10 点 (北京时间 UTC+8，即 UTC 2 点) 运行
    - cron: '0 2 * * 1'
  workflow_dispatch: # 允许手动触发

concurrency:
  group: check-rss-feeds
  cancel-in-progress: false

jobs:
  check-feeds:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test feed checker
        run: npm test

      - name: Check RSS feeds
        id: check
        run: node scripts/check-feeds.js
        continue-on-error: true

      - name: Update or Create Issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('feed-status.json')) {
              console.log('No status file found');
              return;
            }
            
            const status = JSON.parse(fs.readFileSync('feed-status.json', 'utf8'));
            const broken = status.feeds.filter(f => f.status === 'invalid' || (!f.valid && !f.limited));
            const limited = status.feeds.filter(f => f.status === 'limited' || f.limited);
            const issueTitle = '📊 RSS 订阅源健康状态报告';
            
            // 查找是否已存在状态报告 Issue，并固定复用同一个
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'feed-status',
              per_page: 100
            });
            
            const statusIssues = issues.data
              .filter(i => !i.pull_request && i.title === issueTitle)
              .sort((a, b) => b.number - a.number);
            const existingIssue = statusIssues[0];
            const duplicateIssues = statusIssues.slice(1);
            
            // 生成报告内容
            let body = `## 📊 RSS 订阅源健康状态\n\n`;
            body += `> 🕐 最近检测时间: ${status.checkTime}\n\n`;
            body += `| 指标 | 数值 |\n|------|------|\n`;
            body += `| ✅ 可用 | ${status.valid} |\n`;
            body += `| ⚠️ 受限 | ${status.limited || limited.length} |\n`;
            body += `| ❌ 失效 | ${status.invalid} |\n`;
            body += `| 📈 成功率 | ${status.successRate} |\n\n`;

            if (limited.length > 0) {
              body += `### ⚠️ 受限链接 (${limited.length} 个)\n\n`;
              body += `| 名称 | 响应 |\n|------|------|\n`;
              limited.forEach(f => {
                body += `| ${f.name} | ${f.error || `HTTP ${f.statusCode}`} |\n`;
              });
              body += `\n> 这些链接通常是目标站对自动化请求的防护、限流或方法限制；不计为死链，但建议持续观察。\n\n`;
            }
            
            if (broken.length > 0) {
              body += `### ⚠️ 失效链接 (${broken.length} 个)\n\n`;
              body += `| 名称 | 错误 |\n|------|------|\n`;
              broken.forEach(f => {
                body += `| ${f.name} | ${f.error} |\n`;
              });
              body += `\n> 请检查这些链接是否需要更新或移除\n`;
            } else if (limited.length > 0) {
              body += `### ✅ 暂无确认失效链接\n\n`;
              body += `当前没有明确失效的订阅源，但存在 ${limited.length} 个受限响应。\n`;
            } else {
              body += `### ✅ 所有链接正常！\n\n`;
              body += `全部 ${status.total} 个订阅源都可以正常访问。\n`;
            }
            
            body += `\n---\n*此 Issue 由 GitHub Actions 自动更新，请勿手动关闭*`;
            
            if (existingIssue) {
              // 更新现有 Issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              });
              console.log(`Updated issue #${existingIssue.number}`);

              // 关闭重复的状态报告 Issue，之后固定复用最新的一个
              for (const issue of duplicateIssues) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: `已改为固定复用 #${existingIssue.number} 作为 RSS 订阅源健康状态报告，此重复报告自动关闭。`
                });
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  state: 'closed'
                });
                console.log(`Closed duplicate issue #${issue.number}`);
              }
            } else {
              // 创建新 Issue
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: body,
                labels: ['feed-status']
              });
              console.log('Created new status issue');
            }

      - name: Update README badge data
        if: always()
        run: |
          if [ -f feed-status.json ]; then
            TOTAL=$(node -e "console.log(require('./feed-status.json').total || 0)")
            VALID=$(node -e "console.log(require('./feed-status.json').valid || 0)")
            echo "✅ 检测完成: $VALID/$TOTAL 个链接可用"
          fi

      - name: Commit feed status
        if: always()
        run: |
          if [ -f feed-status.json ]; then
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add feed-status.json
            git diff --staged --quiet || git commit -m "chore: 更新订阅源检测状态"
            git push
          fi

      - name: Prepare email content
        id: email
        run: |
          if [ -f feed-status.json ]; then
            # 使用 jq 或 node 解析 JSON 更可靠
            TOTAL=$(node -e "console.log(require('./feed-status.json').total || 0)")
            VALID=$(node -e "console.log(require('./feed-status.json').valid || 0)")
            LIMITED=$(node -e "console.log(require('./feed-status.json').limited || 0)")
            INVALID=$(node -e "console.log(require('./feed-status.json').invalid || 0)")
            RATE=$(node -e "console.log(require('./feed-status.json').successRate || '0%')")
            CHECK_TIME=$(node -e "console.log(require('./feed-status.json').checkTime || 'N/A')")
            
            if [ "$INVALID" -gt 0 ]; then
              echo "subject=⚠️ RSS 订阅源检测发现 ${INVALID} 个失效链接" >> $GITHUB_OUTPUT
              echo "status=有问题" >> $GITHUB_OUTPUT
            elif [ "$LIMITED" -gt 0 ]; then
              echo "subject=⚠️ RSS 订阅源检测发现 ${LIMITED} 个受限响应" >> $GITHUB_OUTPUT
              echo "status=有受限响应" >> $GITHUB_OUTPUT
            else
              echo "subject=✅ RSS 订阅源检测全部正常" >> $GITHUB_OUTPUT
              echo "status=全部正常" >> $GITHUB_OUTPUT
            fi
            
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "valid=$VALID" >> $GITHUB_OUTPUT
            echo "limited=$LIMITED" >> $GITHUB_OUTPUT
            echo "invalid=$INVALID" >> $GITHUB_OUTPUT
            echo "rate=$RATE" >> $GITHUB_OUTPUT
            echo "check_time=$CHECK_TIME" >> $GITHUB_OUTPUT
          else
            echo "subject=❓ RSS 订阅源检测未生成报告" >> $GITHUB_OUTPUT
            echo "status=检测失败" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            echo "valid=0" >> $GITHUB_OUTPUT
            echo "limited=0" >> $GITHUB_OUTPUT
            echo "invalid=0" >> $GITHUB_OUTPUT
            echo "rate=N/A" >> $GITHUB_OUTPUT
            echo "check_time=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Send email notification
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: ${{ steps.email.outputs.subject }}
          to: ${{ secrets.EMAIL_TO }}
          from: RSS Feed Checker <${{ secrets.EMAIL_USERNAME }}>
          body: |
            RSS 订阅源健康检测报告
            
            检测时间: ${{ steps.email.outputs.check_time }}
            检测状态: ${{ steps.email.outputs.status }}
            
            ================================
            📊 检测结果
            ================================
            ✅ 可用: ${{ steps.email.outputs.valid }}
            ⚠️ 受限: ${{ steps.email.outputs.limited }}
            ❌ 失效: ${{ steps.email.outputs.invalid }}
            📈 成功率: ${{ steps.email.outputs.rate }}
            📋 总数: ${{ steps.email.outputs.total }}
            
            查看详细报告:
            https://github.com/${{ github.repository }}/issues
            
            ---
            此邮件由 GitHub Actions 自动发送

      - name: Fail when health report contains invalid feeds
        if: always()
        env:
          CHECK_OUTCOME: ${{ steps.check.outcome }}
        run: |
          node - <<'NODE'
          const fs = require('fs');

          if (!fs.existsSync('feed-status.json')) {
            throw new Error('未生成 feed-status.json，无法确认订阅源健康状态');
          }

          const status = JSON.parse(fs.readFileSync('feed-status.json', 'utf8'));
          if (status.invalid > 0) {
            throw new Error(`发现 ${status.invalid} 个确认失效的 RSS 订阅源`);
          }
          if (process.env.CHECK_OUTCOME !== 'success') {
            throw new Error('订阅源检查器未正常完成');
          }
          NODE
